{% extends "base.html" %}{% block content %}<section class="head"><div><h1>Usuários {{help('usuarios')}}</h1><p>Perfis de administrador e operador.</p></div></section><div class="grid2"><section class="card"><h2>Novo usuário</h2><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Nome<input name="nome"></label><label>Usuário<input name="usuario" required></label><label>Senha<input type="password" name="senha" minlength="8" required></label><label>Papel<select name="papel"><option value="operador">Operador</option><option value="admin">Administrador</option></select></label><button class="btn primary">Criar usuário</button></form></section><section class="card"><h2>Usuários atuais</h2>{% for u in usuarios %}<div class="list-row"><strong>{{u.nome}}</strong><span>{{u.usuario}} • {{u.papel_registro.papel if u.papel_registro else 'admin'}}</span></div>{% endfor %}</section></div>{% endblock %}

{% extends "base.html" %}
{% block auth %}
<div class="auth-bg"><div class="auth-card">
<div class="auth-logo">JSM</div>
<h1>Motor Tributário</h1><p>JSM Contabilidade</p>
{% with msgs=get_flashed_messages(with_categories=true) %}
{% for cat,msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% endwith %}
<form method="post" class="stack">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Usuário<input name="usuario" required autofocus></label>
<label>Senha<input type="password" name="senha" required></label>
<button class="btn primary">Entrar</button>
</form>
<div class="assinatura">Feito por Eduardo de Paiva</div>
</div></div>
{% endblock %}

{% extends "base.html" %}
{% block auth %}
<div class="auth-bg"><div class="auth-card">
<div class="auth-logo">JSM</div>
<h1>Primeiro acesso</h1><p>Crie o administrador inicial.</p>
{% with msgs=get_flashed_messages(with_categories=true) %}
{% for cat,msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% endwith %}
<form method="post" class="stack">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Código de primeiro acesso<input type="password" name="setup_token" required></label>
<label>Nome<input name="nome" required></label>
<label>Usuário<input name="usuario" required></label>
<label>Senha<input type="password" name="senha" minlength="8" required></label>
<label>Confirmar senha<input type="password" name="confirmar" minlength="8" required></label>
<button class="btn primary">Criar administrador</button>
</form>
</div></div>
{% endblock %}
